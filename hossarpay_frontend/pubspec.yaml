name: hossarpay_frontend
description: A minimalist financial and service payment app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  font_awesome_flutter: ^10.7.0
  flutter:
    sdk: flutter
  flutter_contacts: ^1.1.7
  permission_handler: ^11.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.3
  easy_localization: ^3.0.3
  dio: ^5.3.3
  shared_preferences: ^2.2.1
  go_router: ^11.1.2
  image_picker: ^1.2.2
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  emoji_picker_flutter: any
  google_sign_in: ^6.2.1
  lottie: ^3.1.0
  record: ^6.0.0
  audioplayers: any

dev_dependencies:
  font_awesome_flutter: ^10.7.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/translations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.jpg"
  min_sdk_android: 21
