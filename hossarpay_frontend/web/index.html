<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hossarpay - Super App">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hossarpay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hossarpay</title>
  <link rel="manifest" href="manifest.json">

  <!-- TELEGRAM WEB APP SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      background-color: #0F172A;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #loading_indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      z-index: 9999;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 102, 255, 0.2);
      border-top: 4px solid #0066FF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    .loading-text {
      margin-top: 16px;
      color: #0066FF;
      font-weight: 600;
      font-size: 16px;
    }
    @keyframes spin { 
      0% { transform: rotate(0deg); } 
      100% { transform: rotate(360deg); } 
    }
  </style>
</head>
<body>
  <!-- Yüklenme animasyonu kutusu -->
  <div id="loading_indicator">
    <div class="spinner"></div>
  </div>

  <script>
    // 1. TELEGRAM EKRANI BUYUT
    window.addEventListener('load', function() {
      if(window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand(); 
        
        var user = window.Telegram.WebApp.initDataUnsafe ? window.Telegram.WebApp.initDataUnsafe.user : null;
        if (user && user.id) {
           var path = "/tgLogin?tgId=" + user.id + "&firstName=" + encodeURIComponent(user.first_name || '') + "&lastName=" + encodeURIComponent(user.last_name || '') + "&username=" + encodeURIComponent(user.username || '');
           
           // Flutter web router (GoRouter) eger URLRouteStrategy kullaniyorsa path calisir
           // Eger HashRouteStrategy kullaniyorsa /#/tgLogin diye gitmelidir.
           // Garanti olmasi adina ikisini de URL'e isleyelim:
           window.location.href = "/#" + path;
        }
      }
    });

    // 2. Yukleme ekranini Flutter acilinca gizle
    const checkFlutter = setInterval(() => {
        const flutterApp = document.querySelector('flutter-view');
        if (flutterApp && flutterApp.shadowRoot) {
            document.getElementById('loading_indicator').style.display = 'none';
            clearInterval(checkFlutter);
        }
    }, 200);

    // Kirmizi hata gostericiyi kaldirdim, boylece hata vermeden sessizce atlayip acilmaya devam edecek.
  </script>

  <!-- FLUTTER BOOTSTRAP (Yeni Nesil Yukleyici) -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
